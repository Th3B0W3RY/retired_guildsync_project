        title: Código de recuperação
        description: O teu código de recuperação permite redefinir a palavra-passe e recuperar a conta se perderes o acesso ao MFA.
        warning: Guarda este código em segurança — pode contornar a palavra-passe e o MFA!
        current: O teu código de recuperação atual
        no_codes: Não tens um código de recuperação ativo.
        regenerate_button: Regenerar código de recuperação
        regenerate_confirm: Regenerar invalidará o teu código atual e enviaremos um novo por e-mail. Continuar?
