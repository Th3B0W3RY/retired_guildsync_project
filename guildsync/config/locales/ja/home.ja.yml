        roles_desc: 細かな権限を設定し、定義済みカラータグを割り当ててロスター可視性を高めます。
        warnings_title: 警告システム
        warnings_desc: 警告なし・警告あり・BAN済みの管理リストを維持し、モデレーション運用に活用します。
        messaging_title: メッセージセンター
        messaging_desc: GuildSync内からGMとオフィサーがメンバーへ直接連絡できるよう支援します。
        analytics_title: ランキング + エンゲージメント
        analytics_desc: 出席や参加傾向から高アクティブメンバーを可視化し、運営判断を支援します。
