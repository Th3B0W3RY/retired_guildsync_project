          body: GuildSync 프로필에서 이 이메일 주소 확인을 요청하셨습니다. 아래 버튼으로 인증을 완료하세요.
          cta: 이메일 주소 확인
          expires: 이 링크는 24시간 후 만료됩니다.
          fallback: "버튼이 작동하지 않으면 이 URL을 복사하여 브라우저에 붙여넣으세요:"
          ignore: 이 이메일 확인을 요청하지 않으셨다면 이 메시지를 무시하셔도 됩니다.
