        analytics_insights:
          title: Análisis & Conocimientos
          desc: Analítica detallada sobre la actividad y el crecimiento de los miembros
        automation_tools:
          title: Herramientas de Automatización
          desc: Automatizar tareas rutinarias y flujos de trabajo
        advanced_tracking:
          title: Seguimiento avanzado de miembros
          desc: Monitoreo en tiempo real de la actividad del miembro
        multi_guild:
          title: Gestión de múltiples gremios
          desc: Gestionar gremios ilimitados desde un solo panel
        custom_automation:
          title: Automación Personalizada
          desc: Crear flujos de trabajo y desencadenantes personalizados
        analytics_dashboard:
          title: Panel de Analytics
          desc: Detalladas visiones e informes
        role_management:
          title: Gestión de Roles
          desc: Sistema avanzado de asignación de roles
        member_onboarding:
          title: Incorporación de miembros
          desc: Flujo de bienvenida y configuración automatizado
        event_management:
          title: Gestión de Eventos
          desc: Programar y realizar un seguimiento de los eventos de la hermandad
        custom_notifications:
          title: Notificaciones personalizadas
          desc: Sistema de alertas personalizado
        moderation_tools:
          title: Herramientas de Moderación
          desc: Características avanzadas de moderación
        api_integration:
