        how_it_works: Como funciona o teu código de recuperação
        bullet_length: O código tem 24 caracteres (letras e números).
        bullet_single_use: O código é de uso único — depois de usar, deixa de ser válido.
        bullet_use_case: Usa o código de recuperação se esqueceres a palavra-passe OU perderes o acesso ao MFA.
        bullet_store_offline: Guarda-o offline (impressão ou gestor de palavras-passe) — não o voltamos a mostrar!
        bullet_regenerate: Ao regenerar, o código anterior deixa de ser válido; enviamos um novo por e-mail.
      delete_account:
        title: Eliminar conta
        intro: Podes encerrar esta conta de forma permanente e remover os dados GuildSync associados. Após o nosso período de conservação é irreversível; antes, operações podem restaurar alguns dados conforme descrito nas políticas de suporte.
        privacy_link: Política de privacidade
        support_link: Contactar suporte
        primary_cta: Quero eliminar a minha conta
        code_label: Código de verificação por e-mail
        code_hint: Introduz o código de utilização única do teu e-mail (letras e números).
        resend_wait: Podes pedir outro código dentro de %{seconds} segundos.
        continue_button: Continuar para eliminar a conta
        modal_title: Tens a certeza de que queres eliminar a tua conta?
        modal_body: A tua conta será encerrada e a sessão terminada. Após o período de conservação não pode ser anulado.
        modal_cancel: Cancelar
        modal_confirm: Sim, eliminar a minha conta
        blocked:
          generic: A eliminação da conta está bloqueada até resolveres o seguinte.
          already_closed: Esta conta já está encerrada.
          purge_in_progress: A eliminação já está em curso.
          alliance_leader: Sai ou dissolves primeiro as alianças que lideras.
          owned_guild_has_members: Resolve guildas das quais és dono e que ainda têm outros membros ativos (transfere a propriedade, remove membros ou dissolve a guilda).
