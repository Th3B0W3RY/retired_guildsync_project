es:
  home:
    landing:
      title: Bienvenidos a GuildSync
      subtitle: La plataforma todo-en-un-uno para la gestión de tus comunidades de juego, eventos y miembros.
      explore_pricing: Ver precios
      hero_kicker: Pensado para líderes de gremio, oficiales y comunidades activas
      problem_title: Del caos de las hojas de cálculo a la claridad operativa
      problem_subtitle: Unifica eventos, miembros, solicitudes y flujos de botín en un solo lugar para que tus oficiales dediquen menos tiempo al admin y más al liderazgo.
      outcome_1_title: Operaciones de botín justas
      outcome_1_desc: Reglas coherentes, historial de participación visible y menos conflictos.
      outcome_2_title: Coordina mejor los eventos
      outcome_2_desc: Programa eventos, obtén recuentos de inscripción en vivo, sigue llegadas tarde y revisa cobertura de clases/roles en tiempo real.
      outcome_3_title: Reduce la carga de los oficiales
      outcome_3_desc: Controles basados en roles y registros de auditoría mantienen los flujos predecibles.
      trust:
        no_card: No se requiere tarjeta de crédito
        setup: Configuración rápida para equipos de gremio
        security: Permisos por rol + registros de actividad completos
      preview_title: Vista previa del producto
      preview:
        events_title: Eventos
        events_desc: Crea eventos rápido, sigue asistencia y tendencias de participación.
        members_title: Miembros
        members_desc: Gestiona roles, etiquetas, solicitudes y permisos a nivel de gremio desde un solo centro.
        loot_title: Botín + encuestas
        loot_desc: Realiza tiradas de botín y encuestas estructuradas con registros transparentes.
        logs_title: Registros de actividad
        logs_desc: Registra acciones de liderazgo para rendición de cuentas y contexto histórico.
      compare_title: GuildSync frente a la competencia
      compare_old_title: Hoja de cálculo + solo Discord
      compare_old_1: Encontrar la hoja correcta (o empezar una nueva)
      compare_old_2: Actualizar varias pestañas y hojas a mano
      compare_old_3: Pedir a los oficiales que actualicen y revisen los cambios
      compare_new_title: Centro de mando GuildSync
      compare_new_1: Los oficiales con sesión iniciada acceden rápido a documentos, flujos de trabajo y administración estructurada
      compare_new_2: Centraliza datos de miembros, asistencia y gestión de permisos
      compare_new_3: Historial de hermandad, registro de actividad y flujos de notificaciones
      footer_copyright: "© %{year} GuildSync. Todos los derechos reservados."
      cta:
        title: "¿Listo para empezar?"
        description: Únete a miles de comunidades de juegos que ya están utilizando GuildSync.
        button: Iniciar Prueba Gratis
        button_hero: Empieza Gratis
      feature_spotlight:
        title: Lo que GuildSync realmente te ayuda a gestionar
        subtitle: 'Diseñado para operaciones reales de gremio: desde reclutamiento y documentos hasta coordinación de alianzas y moderación.'
        documents_title: Documentos de gremio
        documents_desc: Comparte SOPs, builds y guías con enlaces públicos o acceso interno.
        activity_title: Feed de actividad + registros
        activity_desc: Sigue acciones de liderazgo, cambios de miembros e historial operativo en una sola línea de tiempo.
        alliance_title: Sistema de alianzas
        alliance_desc: Coordina eventos, encuestas y tiradas de botín de alianza entre gremios asociados.
        recruit_title: Reclutamiento + solicitudes
        recruit_desc: Ejecuta un proceso de solicitud estructurado con notas, flujos de aceptar/rechazar y seguimiento.
        ocr_title: Escaneo con IA de capturas de equipo
        ocr_desc: Sube capturas, extrae datos de equipamiento rápidamente y mantén actualizado el estado de equipo de miembros.
        roles_title: Roles personalizados + etiquetas de color
        roles_desc: Configura permisos granulares y asigna etiquetas de color predefinidas para visibilidad rápida del roster.
        warnings_title: Sistema de advertencias
        warnings_desc: Mantén listas de sin advertencias, advertidos y bloqueados para flujos de moderación.
        messaging_title: Centro de mensajes
        messaging_desc: Ayuda a GMs y oficiales a comunicarse con miembros directamente desde GuildSync.
        analytics_title: Clasificación + participación
        analytics_desc: Destaca a los miembros más activos por asistencia y tendencias de participación para apoyar decisiones de liderazgo.
      features:
        guild_management:
          title: Gestión de Gremios
          description: Organiza y gestiona múltiples gremios con facilidad. Rastrea miembros, roles y permisos en un solo lugar.
        event_planning:
          title: Planificación de Eventos
          description: Programar y gestionar eventos con seguimiento de RSVP, recordatorios y gestión de participantes.
        member_analytics:
          title: Análisis de Miembros
          description: Obtenga Insights Detallados Sobre La Actividad De Sus Miembros Y Analice Cómo Se Desarrolla Su Comunidad.
        gear_checks:
          title: Revisar el Equipo
          description: Rastrea y verifica el equipo de los miembros y los requisitos del material para eventos y actividades.
        gear_records:
          title: Registro de Equipo
          description: Mantenga registros detallados de la equipación del miembro, las actualizaciones y el historial de equipos.
        member_tracking:
          title: Seguimiento de miembros
          description: Mantenga registros detallados de la actividad, participación y compromiso de los miembros en todas las actividades de la hermandad.
        role_management:
          title: Gestión de Roles
          description: Asignar y administrar roles con permisos personalizados. Controlar el acceso y las responsabilidades de manera sencilla.
        communication_hub:
          title: Centro de Comunicación
          description: Herramientas de comunicación centralizada para anuncios, discusiones y coordinación de miembros.
        activity_logs:
          title: Registro de actividades
          description: Tracking detallado de actividades y registro para todos los eventos de la hermandad, las acciones de los miembros y los cambios del sistema.
      why_title: "¿Por qué elegir GuildSync?"
      features_cta_hint: Haz clic en cada tarjeta para ver qué hacen realmente las funciones.
      features_section_subtitle: 'Abre cualquier tarjeta para ver el detalle: ideal para quienes comparan herramientas de gremio.'
