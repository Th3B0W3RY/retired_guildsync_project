es:
  discord_connections:
    show:
      title: Conectar el bot con el servidor de Discord
      subtitle_connected: Tu cuenta de Discord ya está conectada. Selecciona un servidor de Discord (donde eres dueño o administrador) al que conectar el bot de GuildSync para la gestión de eventos y notificaciones.
