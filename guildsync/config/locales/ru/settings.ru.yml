ru:
  settings:
    account:
      title: Настройки аккаунта
      subtitle: Управляйте безопасностью и параметрами аккаунта
      password:
        title: Изменить пароль
        description: Обновить пароль аккаунта
        button: Изменить пароль
      discord:
        title: Аккаунт Discord
        connected_as: Подключено как %{username}
        not_connected: Аккаунт Discord не подключён
        disconnect: Удалить подключение Discord
        disconnect_confirm: Вы уверены, что хотите отключить аккаунт Discord? Подключение будет удалено; для функций Discord потребуется подключиться снова.
        switch_to_mfa_first: Сначала переключитесь на вход MFA, чтобы отключить Discord
        connect: Подключить аккаунт Discord
      auth_method:
        title: Метод аутентификации
        description: Выберите способ входа в аккаунт.
        mfa:
          title: Вход по MFA
          description: Пароль и многофакторная аутентификация
          button: Использовать MFA
          button_active: Используется MFA
        discord:
          title: Вход через Discord
          description: Войти с аккаунтом Discord
          button: Использовать Discord
          button_active: Используется Discord
          connect_first: Сначала подключите аккаунт Discord
        google:
          title: Вход через Gmail
          description: Ты входишь через Google с привязанным аккаунтом Gmail или Google Workspace.
          active: Используется Gmail
        microsoft:
          title: Вход через Outlook
          description: Ты входишь через Microsoft с личным аккаунтом (Outlook, Hotmail и т. п.).
          active: Используется Outlook
        mfa_backup_warning: Рассмотрите MFA как запасной метод.
        discord_connect_warning: Подключение Discord может упростить вход и расширить возможности.
      language:
        title: Язык
        description: Выберите язык. По умолчанию для вошедших пользователей — английский (без входа может применяться язык браузера, если не выбран пункт меню).
        label: Предпочитаемый язык
        auto_detect: По умолчанию (английский)
        save: Сохранить язык
        updated: Настройки языка обновлены.
        invalid: Недопустимый выбор языка.
      mfa:
        title: Многофакторная аутентификация (MFA)
        enabled: MFA включена.
        not_enabled: MFA не настроена. Настройте её для защиты аккаунта.
        manage: Управление MFA
        setup: Настроить MFA
      backup_codes:
        title: Резервный код
        description: Резервный код позволяет сбросить пароль и восстановить аккаунт, если вы потеряли доступ к MFA.
        warning: Храните этот код в безопасности — он обходит пароль и MFA!
        current: Ваш текущий резервный код
        no_codes: У вас нет активного резервного кода.
        regenerate_button: Перевыпустить резервный код
        regenerate_confirm: Перевыпуск аннулирует текущий код и мы отправим новый по электронной почте. Продолжить?
        regenerate_description: Перевыпускать резервный код можно не чаще чем раз в 3 месяца. Новый код будет отправлен на подтверждённый адрес электронной почты.
        regenerated_notice: Мы отправили новый резервный код на ваш подтверждённый адрес электронной почты.
        cooldown_active: Вы сможете снова создать резервный код %{date}.
        verify_email_first: Сначала подтвердите адрес электронной почты перед перевыпуском резервного кода.
        how_it_works: Как работает резервный код
        bullet_length: Код состоит из 24 символов (буквы и цифры).
        bullet_single_use: Код одноразовый — после использования он недействителен.
        bullet_use_case: Используйте резервный код, если забыли пароль ИЛИ потеряли доступ к MFA.
        bullet_store_offline: Храните код офлайн (распечатайте или в менеджере паролей) — мы больше не покажем его!
        bullet_regenerate: При перевыпуске старый код становится недействительным; новый отправляется по электронной почте.
      delete_account:
        title: Удалить аккаунт
        intro: Вы можете навсегда закрыть этот аккаунт и удалить связанные данные GuildSync. После истечения срока хранения это необратимо; до этого операции могут восстановить некоторые данные согласно политикам поддержки.
        privacy_link: Политика конфиденциальности
        support_link: Связаться с поддержкой
        primary_cta: Я хочу удалить свою учётную запись
        code_label: Код подтверждения по электронной почте
        code_hint: Введите одноразовый код из письма (буквы и цифры).
        resend_wait: Вы можете запросить другой код через %{seconds} сек.
        continue_button: Продолжить удаление аккаунта
        modal_title: Вы уверены, что хотите удалить аккаунт?
        modal_body: Аккаунт будет закрыт и вы выйдете из системы. После истечения срока хранения это нельзя отменить.
        modal_cancel: Отмена
        modal_confirm: Да, удалить мой аккаунт
        blocked:
          generic: Удаление аккаунта заблокировано, пока не будут устранены указанные проблемы.
          already_closed: Этот аккаунт уже закрыт.
          purge_in_progress: Удаление уже выполняется.
          alliance_leader: Сначала покиньте или распустите альянсы, где вы лидер.
          owned_guild_has_members: Разрешите ситуацию с гильдиями, владельцем которых вы являетесь и где остались другие активные участники (передайте владение, удалите участников или расформируйте гильдию).
    profile:
      title: Настройки профиля
      subtitle: Настройте свой профиль
      email_verification:
        required_notice: Добавьте и подтвердите реальный адрес электронной почты на этой странице, чтобы продолжить пользоваться GuildSync.
        banner_title: Подтвердите почту
        banner_body: Для аккаунта используется заполнитель или неподтверждённая почта. Укажите реальный адрес ниже и подтвердите ссылку, которую мы отправим.
        invalid_link: Эта ссылка подтверждения недействительна или срок её действия истёк. Запросите новое письмо ниже.
        success_notice: Ваш адрес электронной почты подтверждён.
        update_failed: Не удалось обновить адрес почты. Попробуйте снова или запросите новую ссылку для подтверждения.
      avatar:
        title: Аватар профиля
        change: Изменить аватар
        upload: Загрузить аватар
        remove: Убрать аватар
        remove_confirm: Удалить аватар?
        updated_notice: Аватар успешно обновлён.
        removed_notice: Аватар успешно удалён.
      username:
        title: Имя пользователя
        current: "Текущее имя пользователя:"
        label: Новое имя пользователя
        hint: "3–30 символов: буквы, цифры и подчёркивания."
        save: Сохранить имя пользователя
        updated_notice: Имя пользователя обновлено.
        update_failed: Не удалось обновить имя пользователя.
      email:
        title: Адрес электронной почты
        current: "Текущая почта:"
        verified_badge: Подтверждено
        unverified_badge: Не подтверждено — укажите реальную почту ниже
        label: Электронная почта для подтверждения
        placeholder: you@example.com
        send_verification: Отправить письмо для подтверждения
        verification_sent_notice: Проверьте почту — там ссылка для подтверждения.
        pending_notice: Ссылка для подтверждения отправлена на %{email}.
        taken: Этот адрес электронной почты уже используется.
        mailer:
          subject: Подтвердите адрес электронной почты GuildSync
          heading: Подтвердите адрес электронной почты
          greeting: Здравствуйте,
          body: Вы запросили подтверждение этого адреса электронной почты для профиля GuildSync. Нажмите кнопку ниже, чтобы завершить проверку.
          cta: Подтвердить адрес электронной почты
          expires: Срок действия ссылки истекает через 24 часа.
          fallback: "Если кнопка не работает, скопируйте этот URL и вставьте в браузер:"
          ignore: Если вы не запрашивали эту проверку почты, проигнорируйте это сообщение.
