    show:
      title: Abilita l'autenticazione a più fattori
      subtitle: Scani il codice QR con l'applicazione di autenticazione per iniziare.
      instructions_title: Istruzioni di Setup
      step_1: Installa un'applicazione di autenticazione sul tuo telefono (Google Authenticator, Authy, Microsoft Authenticator, ecc.)
      step_2: Apri l'app e fai clic su 'Aggiungere account' o sul pulsante '+'.
      step_3: Scani il codice QR qui sotto con la fotocamera del telefono o lo scanner dell'app
      step_4: Inserisci il codice a sei cifre dall'app per verificare.
      manual_entry: 'Non riesci a scansionare il QR code? Inserisci questo segreto manualmente nell''app di autenticazione:'
