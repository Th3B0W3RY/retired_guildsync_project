        title: GuildSync 真正能帮你管理什么
        subtitle: 为真实公会运营打造：从招募与文档管理，到联盟协作与社区治理。
        documents_title: 公会文档
        documents_desc: 通过公开链接或仅内部访问共享 SOP、配装和指南。
        activity_title: 活动动态 + 日志
        activity_desc: 在一条时间线上追踪管理操作、成员变更和运营历史。
        alliance_title: 联盟系统
        alliance_desc: 在合作公会之间协调联盟活动、投票和战利品掷骰。
