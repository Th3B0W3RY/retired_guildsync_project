      outcome_1_desc: Единые правила, видимая история участия и меньше конфликтов.
      outcome_2_title: Лучше координируйте события
      outcome_2_desc: Планируйте события, получайте живую статистику регистраций, отслеживайте опоздания и видите покрытие классов/ролей в реальном времени.
      outcome_3_title: Снизьте нагрузку на офицеров
      outcome_3_desc: Контроль по ролям и журналы аудита делают процессы предсказуемыми.
      trust:
