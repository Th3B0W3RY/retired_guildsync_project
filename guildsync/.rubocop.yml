# .rubocop_todo.yml grandfathers pre-existing, purely cosmetic offenses (trailing
# whitespace, quote style, bracket spacing, etc.) via per-file Exclude lists so the
# lint job is green without a 300-file mass-autocorrect. NEW code is still fully
# linted. To pay down debt: run `bin/rubocop -a` on a file, then drop its entry from
# .rubocop_todo.yml (or regenerate with `bin/rubocop --auto-gen-config --no-exclude-limit`).
inherit_from: .rubocop_todo.yml

# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false
