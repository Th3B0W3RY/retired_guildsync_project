de:
  discord_connections:
    show:
      title: Bot zur Gilde Discord verbinden
      subtitle_connected: Ihr Discord-Account ist bereits verbunden. Wählen Sie einen Discord-Server (wo Sie Besitzer oder Serveradministrator sind), um den GuildSync-Bot zu verbinden, für die Verwaltung von Events und Benachrichtigungen.
      subtitle_not_connected: Zuerst connecten Sie Ihre Discord-Account (Einmalige Einrichtung). Dann wählen Sie einen Discord-Server aus (wo Sie Besitzer oder Serveradministrator sind), um den GuildSync-Bot mitzuschließen. Nach der Auswahl eines Servers autorisieren Sie den GuildSync-Bot, diesem Server beizutreten.
      server_not_selected:
        title: Discord-Server nicht ausgewählt
        message: Bitte wählen Sie einen Discord-Server aus, um Events darauf zu posten.
        select_button: Discord-Server auswählen
      server_selected:
        title: Ausgewählter Discord-Server
        server_label: 'Discord-Server:'
        connected: Verbunden
      bot_connected:
        title: GuildSync-Bot ist verbunden
      configuration_error:
        title: Konfigurationsfehler
      bot_authorization:
        title: Bot-Autorisierung erforderlich
        message: Klicken Sie unten, um den GuildSync-Bot autorisieren zu lassen, sich Ihrem Discord-Server "%{server_name}" anzuschließen.
        authorize_button: Autorisieren GuildSync-Bot
        authorize_hint: Klicken Sie auf den Button oben, um den GuildSync-Bot autorisieren zu lassen, sich Ihrem Discord-Server anzuschließen "%{server_name}". Das Popup schließt sich automatisch nach der Autorisierung.
      reconnect_button: Wiederherstellen / Konto ändern
      disconnect_button: Trennen von Discord
      disconnect_confirm: Möchtest du wirklich den Discord-Verbinden von diesem Server trennen?
      connection_invalid:
        title: Verbindung ungültig
        message: Ihre Discord-Verbindung ist nicht länger gültig. Bitte stellen Sie die Verbindung wieder her.
        last_connected: 'Letzter verbundener Zeitpunkt:'
      reconnect_discord: Discord wiedeRherstellen
      delete_connection: Lösche Verbindung
      delete_confirm: Sind Sie sicher, dass Sie diese ungültige Discord-Verbindung löschen möchten?
      bot_not_connected:
        title: Bot nicht verbunden
        message: Der GuildSync-Bot ist nicht an einen Discord-Server für diese Gilde verbunden.
      connect_section:
        title: Bot mit Discord-Server verbinden
        already_connected: Ihr Discord-Konto ist bereits verbunden. Wählen Sie den Discord-Server aus, mit dem Sie die GuildSync-Bot-Verbindung herstellen möchten. Sie müssen Besitzer oder Serveradministrator des Servers sein.
        not_connected: Zuerst verbinden Sie Ihr Discord-Konto (einmalige Einrichtung). Dann wählen Sie den Discord-Server aus, den Sie mit dem GuildSync-Bot verbinden möchten. Sie müssen Besitzer oder Serveradministrator des Servers sein. Nach der Auswahl eines Servers autorisieren Sie den GuildSync-Bot, diesem Server beizutreten.
        select_server: Discord-Server auswählen
        connect_and_select: Discord-Konto verbinden & Server auswählen
      back_to_dashboard: Zurück zum Dashboard
      popup_blocked: Popup wurde blockiert. Bitte erlauben Sie Popups für diese Website und versuchen Sie es erneut.
    select_server:
      title: Discord-Server auswählen
      subtitle: Wählen Sie den Discord-Server aus, mit dem Sie den GuildSync-Bot verbinden möchten. Nach der Auswahl eines Servers werden Sie den GuildSync-Bot die Bereitschaft zu diesem Server erteilen.
      header: Discord-Server
      header_subtitle: Wählen Sie einen Server, wo Sie Besitzer oder Serveradministrator sind, um den GuildSync-Bot zu verbinden.
      role_owner: Besitzer
      role_admin: Serveradministrator
      empty_title: Keine Discord-Server gefunden
      empty_message: Sie müssen Besitzer oder Serveradministrator von mindestens einem Discord-Server sein, um den Bot anzuschließen.
      go_back: Zurückgehen
      back_to_dashboard: Zurück zum Dashboard
    callback_success:
      title: Erfolgreich verbunden!
      message: Der Discord-Server wurde erfolgreich verbunden.
      closing: Diese Fenster wird automatisch nach 1 Sekunde schließen...
    callback_error:
      title: Verbindung fehlgeschlagen
      closing: Diese Fenster wird automatisch in 3 Sekunden schließen...
    auto_authorize_bot:
      title: Bot-Autorisierung öffnet...
      please_authorize: Bitte autorisieren Sie den Bot, sich bei "%{server_name}" zu betreten.
  discord_user_auth:
    callback_success:
      title: Discord-Authentifizierungserfolg
      closing: Erfolg! Fenster schließt...
    callback_error:
      title: Fehler
      default_message: Discord-Authentifizierung fehlgeschlagen.
      closing: Das Fenster wird in 2 Sekunden automatisch schließen...
  discord_events:
    new:
      title: Discord-Event erstellen für %{guild_name}
      subtitle: Einen neuen Event erstellen, der auf Discord gepostet wird, für alle Benutzer, die ihn ansehen und sich anmelden können.
