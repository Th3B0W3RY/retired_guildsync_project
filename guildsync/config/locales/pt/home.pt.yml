          custom_branding: Marca Personalizada
          member_onboarding: Integração de membros
          event_management: Gestão de Eventos
          role_management: Gestão de Funções
          export_backup: Exportar & Backup
          custom_role_system: Sistema de funções personalizado
      features_grid:
        member_management:
          title: Gestão de Membros
          desc: Rastreie e organize seus membros da guilda de forma eficiente
        analytics_insights:
          title: Análises e Insights
          desc: Análises detalhadas sobre a atividade dos membros e o crescimento
        automation_tools:
          title: Ferramentas de Automação
          desc: Automatize tarefas rotineiras e fluxos de trabalho
        advanced_tracking:
          title: Rastreamento Avançado de Membros
          desc: Monitoramento em tempo real da atividade dos membros
        multi_guild:
          title: Gestão de Múltiplas Guildas
          desc: Gerencie guildas ilimitadas a partir de um dashboard único
        custom_automation:
          title: Automatização Personalizada
          desc: Crie fluxos de trabalho personalizados e gatilhos
        analytics_dashboard:
          title: Quadro de Análises
          desc: Insights detalhados e relatórios
        role_management:
          title: Gestão de Funções
          desc: Sistema de atribuição de funções avançado
        member_onboarding:
          title: Integração de membros
          desc: Fluxos automatizados de bem-vindo e configuração
        event_management:
          title: Gestão de Eventos
          desc: Agendar e monitorar eventos da guilda
        custom_notifications:
          title: Notificações Personalizadas
          desc: Sistema de alertas personalizados
        moderation_tools:
          title: Ferramentas de Moderação
          desc: Recursos de moderação avançadas
        api_integration:
          title: Integração de API
          desc: Acesso integral à API para desenvolvedores
        export_backup:
          title: Exportar & Backup
          desc: Exportação de dados e backup automático
        priority_support:
          title: Suporte Prioritário
          desc: Equipe de suporte dedicado, totalmente disponível 24/7
        security_features:
          title: Recursos de Segurança
          desc: Segurança de alto nível para grandes empresas
        custom_branding:
          title: Marca Personalizada
          desc: Opções de marca branca disponíveis
        mobile_app:
          title: Aplicativo Móvel
          desc: iOS e aplicativos Android incluídos
        unlimited_storage:
          title: Armazenamento Ilimitado
          desc: Sem limites no armazenamento de dados
        custom_role_system:
          title: Sistema de funções personalizado
          desc: Funções e permissões alinhadas ao Discord, moldadas à estrutura da sua guilda
      footer:
        tagline: A mais completa plataforma de gestão de guildas para comunidades do Discord.
        product: Produto
        features: Recursos
        pricing_link: Preços
        roadmap_link: Roadmap
        support: Suporte
        documentation: Documentação
        contact: Contato
        disaster_recovery: Recuperação de desastres e de dados
        status: Estado
        legal: Legal
        privacy: Privacidade
        terms: Termos
        security_link: Segurança
      features:
        guild_management:
          title: Gestão de Guildas
          description: Organize e gerencie múltiplas guildas com facilidade. Rastreie membros, papéis e permissões tudo em um único lugar.
        event_planning:
          title: Planejamento de Eventos
          description: Agende e gerencie eventos com rastreamento de RSVP, lembretes e gerenciamento de participantes.
        member_analytics:
          title: Análises de Membros
          description: Obter Insights Sobre a Sua Comunidade com Análises Detalhadas e Rastreamento de Atividades dos Membros.
        gear_checks:
          title: Cheques de Equipamento
          description: Monitorar e verificar os requisitos de equipamentos e pertences dos membros para eventos e atividades.
        gear_records:
          title: Registro de Equipamentos
          description: Manter registros completos de equipamentos dos membros, atualizações e histórico de equipamentos.
        member_tracking:
          title: Rastreamento de Membros
          description: Manter registros detalhados de atividade, participação e engajamento em todas as atividades da guilda.
        role_management:
          title: Gestão de Funções
          description: Atribuir e gerenciar papéis com permissões personalizadas. Controlar o acesso e as responsabilidades de forma simples.
        communication_hub:
          title: Central de Comunicação
          description: Ferramentas de comunicação centralizadas para anúncios, discussões e coordenação-de-membros.
        activity_logs:
          title: Logs de Atividade
          description: Rastreamento e registro detalhados de atividades para todos os eventos da Guilda, ações dos membros e alterações no sistema.
