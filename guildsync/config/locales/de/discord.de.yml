        placeholder: Geben Sie den Namen Ihres benutzerdefinierten Ereignistyps an
        hint: Geben Sie einen Namen für Ihren benutzerdefinierten Ereignistyp ein.
      event_title:
        label: Ereignis-Titel
        placeholder: Geben Sie den Veranstaltungstitel ein
      discord_roles:
