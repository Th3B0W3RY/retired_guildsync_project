ko:
  home:
    landing:
      title: GuildSync에 오신 것을 환영합니다
      subtitle: 게임 커뮤니티, 이벤트, 멤버를 관리하는 올인원 플랫폼입니다.
      hero_kicker: 길드 리더, 운영진, 활발한 커뮤니티를 위해
      problem_title: 스프레드시트 혼란에서 운영 명확성으로
      problem_subtitle: 이벤트, 멤버, 지원서, 전리품 워크플로를 한곳에 모아 운영진이 행정에 쓰는 시간을 줄이고 리더십에 집중하게 합니다.
      outcome_1_title: 공정한 전리품 운영
      outcome_1_desc: 일관된 규칙, 가시적인 참여 기록, 갈등 감소.
      outcome_2_title: 이벤트를 더 잘 조율
      outcome_2_desc: 이벤트를 예약하고, 실시간 신청 수를 확인하고, 지각자를 추적하며, 클래스/역할 커버리지를 실시간으로 확인하세요.
      outcome_3_title: 운영진 부담 줄이기
      outcome_3_desc: 역할 기반 제어와 감사 로그로 워크플로를 예측 가능하게 유지합니다.
      trust:
        no_card: 신용카드 불필요
        setup: 길드 팀을 위한 빠른 시작
        security: 역할 권한 + 전체 활동 로그
      preview_title: 제품 미리보기
      preview:
        events_title: 이벤트
        events_desc: 이벤트를 빠르게 만들고 출석과 참여 추세를 추적하세요.
        members_title: 멤버
        members_desc: 역할, 태그, 지원서, 길드 수준 권한을 한 허브에서 관리하세요.
        loot_title: 전리품 + 투표
        loot_desc: 투명한 기록으로 구조화된 전리품 굴림과 투표를 진행하세요.
        logs_title: 활동 로그
        logs_desc: 책임과 맥락을 위해 리더십 활동을 기록하세요.
      explore_pricing: 요금제 보기
      why_title: 왜 길즈ync를 선택하세요?
      features_cta_hint: 각 카드를 클릭하면 기능이 실제로 무엇을 하는지 확인할 수 있습니다.
      features_section_subtitle: 카드를 열어 자세히 살펴보세요. 길드 도구를 비교하는 방문자에게 적합합니다.
      feedback:
        section_title: 사용자 피드백
        carousel_role: 캐러셀
        slide_role: 슬라이드
        keyboard_hint: 좌우 화살표 키로 후기를 이동할 수 있습니다.
        announce_progress: 사용자 피드백 %{current} / %{total}
        previous: 이전 피드백
        next: 다음 피드백
        pagination: 피드백 슬라이드
        go_to_slide: 피드백 %{index}번으로 이동
      compare_title: GuildSync vs 경쟁사
      compare_old_title: 스프레드시트 + Discord만
      compare_old_1: 올바른 시트를 찾거나 새로 만듭니다
      compare_old_2: 여러 탭과 시트를 수동으로 업데이트합니다
      compare_old_3: 운영진에게 수정과 재확인을 요청합니다
      compare_new_title: GuildSync 지휘 센터
      compare_new_1: 로그인한 운영진이 문서, 워크플로, 구조화된 관리 흐름에 빠르게 접근합니다
      compare_new_2: 멤버 데이터, 출석 기록, 권한 관리를 한곳에 모읍니다
      compare_new_3: 길드 기록, 활동 로그, 알림 워크플로
      footer_copyright: "© %{year} GuildSync. 판권 소유."
      cta:
        title: 시작할 준비가 되셨나요?
        description: 이미 GuildSync를 사용하는 수천 개의 게임 커뮤니티에 합류하세요.
        button: 무료 체험 시작
        button_hero: 무료로 시작하기
      feature_spotlight:
        title: GuildSync가 실제로 운영에 도움이 되는 부분
        subtitle: 모집과 문서 관리부터 동맹 조율 및 모더레이션까지, 실제 길드 운영을 위해 설계되었습니다.
        documents_title: 길드 문서
        documents_desc: SOP, 빌드, 가이드를 공개 링크 또는 내부 전용으로 공유하세요.
        activity_title: 활동 피드 + 로그
        activity_desc: 리더십 활동, 멤버 변경, 운영 이력을 하나의 타임라인에서 추적하세요.
        alliance_title: 동맹 시스템
        alliance_desc: 협력 길드 간 동맹 이벤트, 투표, 전리품 롤을 조율하세요.
        recruit_title: 모집 + 지원서
        recruit_desc: 메모, 수락/거절 흐름, 후속 메시징이 포함된 구조화된 지원 프로세스를 운영하세요.
        ocr_title: AI 장비 스크린샷 스캔
        ocr_desc: 스크린샷을 업로드해 로드아웃 데이터를 빠르게 추출하고 멤버 장비 상태를 최신으로 유지하세요.
        roles_title: 사용자 지정 역할 + 색상 태그
        roles_desc: 세분화된 권한을 설정하고 미리 정의된 색상 태그를 지정해 명단 가시성을 높이세요.
        warnings_title: 경고 시스템
        warnings_desc: 경고 없음, 경고됨, 차단됨 목록을 유지해 모더레이션 워크플로를 관리하세요.
        messaging_title: 메시지 센터
        messaging_desc: GuildSync에서 GM과 운영진이 멤버와 직접 소통할 수 있도록 지원합니다.
        analytics_title: 리더보드 + 참여도
        analytics_desc: 출석과 참여 추세를 바탕으로 활발한 멤버를 파악해 운영 의사결정을 지원하세요.
      compare:
