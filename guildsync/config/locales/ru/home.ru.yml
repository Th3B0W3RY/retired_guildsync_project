        setup: Быстрый старт для команд гильдии
        security: Права по ролям + полные журналы активности
      preview_title: Предпросмотр продукта
      preview:
        events_title: События
        events_desc: Быстро создавайте события, отслеживайте посещаемость и тренды участия.
        members_title: Участники
        members_desc: Управляйте ролями, тегами, заявками и правами гильдии из одного центра.
        loot_title: Лут + опросы
        loot_desc: Проводите структурированные розыгрыши лута и опросы с прозрачной историей.
        logs_title: Журналы активности
        logs_desc: Фиксируйте действия руководства для подотчётности и контекста.
      explore_pricing: Посмотреть тарифы
      why_title: Почему выбирать GuildSync?
