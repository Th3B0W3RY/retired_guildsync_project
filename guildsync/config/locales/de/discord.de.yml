        subtitle: Wählen Sie eine oder mehrere Discord-Rollen aus, die beim Posten des Events erwähnt werden sollen.
      description:
        label: Beschreibung
        placeholder: Gib eine Beschreibung für das Event ein
      date:
        label: Datum
      time:
        label: Zeit
        hour: Stunde
        minute: Minute
        ampm: AM/PM
        timezone_detecting: Ihre Zeitzone wird ermittelt...
        timezone_label: 'Zeitzone: %{timezone}'
        timezone_default: 'Zeitzone: UTC (voredefiniert)'
        incomplete_error: Bitte wählen Sie eine vollständige Zeit aus (Stunde, Minute und AM/PM)
      max_participants:
        label: Max Teilnehmer (optional)
      squad_leader:
        label: Gruppenführer (optional)
        placeholder: Geben Sie den Squadleader-Namen ein
      location:
        label: Ort (optional)
        placeholder: Gib den Ort der Veranstaltung ein
      role_categories:
        label: Rollenkategorien
        hint: Wählen Sie die Rollen aus, für die sich Benutzer registrieren können. Alle ausgewählten Rollen werden für die Registrierung in Discord verfügbar gemacht.
        dps: Schaden pro Sekunde
        tank: Verteidiger
        healer: Heiler
        ranged: Entfernungsschaden
      create_button: Ereignis erstellen
      back_to_events: Zurück zu den Events
    show:
      signups_by_role: Anmeldungen nach Rolle
      no_signups: Noch keine Anmeldungen.
      status:
        on_time: Zuverlässig
        tentative: Vorschlag
        late: verspätet
        absent: Abwesend
      back_to_events: Zurück zu den Events
      delete_event: Löschevent
      delete_confirm: Sind Sie sicher, dass Sie diesen Event löschen möchten?
