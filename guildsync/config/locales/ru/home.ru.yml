      compare_old_1: Найти нужную таблицу (или создать новую)
      compare_old_2: Вручную обновлять несколько вкладок и листов
      compare_old_3: Просить офицеров обновлять данные и перепроверять правки
      compare_new_title: Командный центр GuildSync
      compare_new_1: Вошедшие офицеры быстро получают доступ к документам, рабочим процессам и структурированному админ-потоку
      compare_new_2: Централизуйте данные участников, посещаемость и управление правами
      compare_new_3: История гильдии, журнал активности и уведомления
