      title: Seleccionar Servidor de Discord
      subtitle: Elige el servidor de Discord al que quieres conectar el bot GuildSync. Después de seleccionar un servidor, autorizarás al bot GuildSync para unirse a ese servidor.
      header: Discord Servidor
      header_subtitle: Seleccione un servidor donde seas dueño o administrador para conectar el bot de GuildSync.
      role_owner: Propietario
      role_admin: Administrador
      empty_title: No se han encontrado servidores de Discord
      empty_message: Necesitas ser propietario o administrador de al menos un servidor de Discord para conectar el bot.
      go_back: Volver
      back_to_dashboard: Volver al Dashboard
    callback_success:
      title: Conectado exitosamente!
      message: El servidor de Discord se ha conectado exitosamente.
      closing: Esta ventana se cerrará automáticamente en 1 segundo...
    callback_error:
      title: Fallo De Conexión
      closing: Esta ventana se cerrará automáticamente en 3 segundos...
    auto_authorize_bot:
      title: Autorización del Bot en Proceso...
      please_authorize: Por favor autorice al bot para unirse a '%{server_name}'
