pt:
  home:
    landing:
      title: Bem-vindo a GuildSync
      subtitle: A plataforma all-in-one para gerenciar suas comunidades de jogos, eventos e membros.
      hero_kicker: Feito para líderes de guilda, oficiais e comunidades ativas
      problem_title: Do caos da planilha à clareza operacional
      problem_subtitle: Unifique eventos, membros, candidaturas e fluxos de saque em um só lugar para que seus oficiais gastem menos tempo com administração e mais liderando.
      outcome_1_title: Operações de saque justas
      outcome_1_desc: Regras consistentes, histórico de participação visível e menos atrito.
      outcome_2_title: Coordene eventos melhor
      outcome_2_desc: Agende eventos, obtenha contagens de inscrição em tempo real, acompanhe atrasos e veja cobertura de classes/funções em tempo real.
      outcome_3_title: Reduza a carga dos oficiais
      outcome_3_desc: Controles baseados em funções e logs de auditoria mantêm os fluxos previsíveis.
      trust:
        no_card: Não é necessário cartão de crédito
        setup: Configuração rápida para equipes de guilda
        security: Permissões por função + logs de atividade completos
      preview_title: Pré-visualização do produto
      preview:
        events_title: Eventos
        events_desc: Crie eventos rapidamente, acompanhe presença e tendências de participação.
        members_title: Membros
        members_desc: Gerencie funções, tags, candidaturas e permissões da guilda em um hub único.
        loot_title: Saque + enquetes
        loot_desc: Execute rolagens de saque e enquetes estruturadas com registros transparentes.
        logs_title: Logs de atividade
        logs_desc: Registre ações de liderança para prestação de contas e contexto histórico.
      explore_pricing: Ver preços
      why_title: Por que escolher Guild Sync?
      features_cta_hint: Clique em cada cartão para ver o que as funcionalidades fazem na prática.
      features_section_subtitle: Abra qualquer cartão para ver a explicação completa—ideal para quem compara ferramentas de guilda.
      feedback:
        section_title: Feedback dos usuários
        carousel_role: carrossel
        slide_role: slide
        keyboard_hint: Use as setas esquerda e direita para mudar entre depoimentos.
        announce_progress: Feedback de utilizadores %{current} de %{total}
        previous: Feedback anterior
        next: Feedback seguinte
        pagination: Slides de feedback
        go_to_slide: Ir para o feedback %{index}
      compare_title: GuildSync vs concorrentes
      compare_old_title: Planilha + só Discord
      compare_old_1: Encontrar a planilha certa (ou criar uma nova)
      compare_old_2: Atualizar várias abas e planilhas manualmente
      compare_old_3: Pedir aos oficiais para atualizar e conferir
      compare_new_title: Centro de comando GuildSync
      compare_new_1: Oficiais com sessão iniciada acessam rapidamente documentos, fluxos de trabalho e administração estruturada
      compare_new_2: Centralize dados de membros, presenças e gestão de permissões
      compare_new_3: Histórico da guilda, registro de atividade e notificações
      footer_copyright: "© %{year} GuildSync. Todos os direitos reservados."
      cta:
        title: Pronto para começar?
        description: Junte-se a milhares de comunidades de jogos que já usam o GuildSync.
        button: Iniciar Teste Grátis
        button_hero: Começar Grátis
      feature_spotlight:
        title: O que o GuildSync realmente ajuda você a operar
        subtitle: 'Criado para operações reais de guilda: de recrutamento e documentos a coordenação de alianças e moderação.'
        documents_title: Documentos da guilda
        documents_desc: Compartilhe SOPs, builds e guias com links públicos ou acesso apenas interno.
        activity_title: Feed de atividade + logs
        activity_desc: Acompanhe ações de liderança, mudanças de membros e histórico operacional em uma única linha do tempo.
        alliance_title: Sistema de alianças
        alliance_desc: Coordene eventos, enquetes e rolagens de saque de alianças entre guildas parceiras.
        recruit_title: Recrutamento + candidaturas
        recruit_desc: Execute um processo estruturado de candidatura com notas, fluxos de aceitar/rejeitar e mensagens de acompanhamento.
        ocr_title: Leitura por IA de screenshots de equipamento
        ocr_desc: Envie screenshots, extraia dados de loadout rapidamente e mantenha o status de equipamento dos membros atualizado.
        roles_title: Funções personalizadas + tags coloridas
        roles_desc: Configure permissões granulares e atribua tags de cor predefinidas para visibilidade rápida do elenco.
        warnings_title: Sistema de avisos
        warnings_desc: Mantenha listas de sem aviso, avisados e banidos para fluxos de moderação.
        messaging_title: Central de mensagens
        messaging_desc: Ajude GMs e oficiais a se comunicarem com membros diretamente pelo GuildSync.
        analytics_title: Ranking + engajamento
        analytics_desc: Destaque os membros mais ativos por presença e tendências de participação para orientar decisões de liderança.
      compare:
        feature: Característica
        competitor_1: Guild Manager
        competitor_2: GuildSpire
        competitor_3: Soluções típicas de gestão de guildas
        features:
          rapid_user_feedback: Desenvolvimento rápido baseado em feedback dos utilizadores
          unlimited_guilds: Guildas ilimitadas
          starter_basic_plan_value: Plano Basic — recursos essenciais sem entrada só premium
          multi_game_dashboard: Painel multi-jogo para guildas
          events_scheduling: Eventos, RSVPs e agendamento
          loot_rolls_distribution: Loot rolls e distribuição justa
          recruitment_applications: Recrutamento e candidaturas
          discord_integration: Bot Discord e integração
          member_analytics: Análises e insights de membros
          audit_history: Histórico de auditoria e atividade a longo prazo
          guild_documents_storage: Documentos da guilda e armazenamento
          polls_community_votes: Sondagens e votos da comunidade
          public_roadmap_voting: Roadmap público e votação de funcionalidades
          api_access: Acesso à API
          export_data_backup: Exportação e cópia de segurança
          advanced_analytics: Análises Avançadas
          custom_automation: Automatização Personalizada
          realtime_tracking: Rastreamento em Tempo Real
          api_integration: Integração de API
          mobile_apps: Aplicativos Móveis
