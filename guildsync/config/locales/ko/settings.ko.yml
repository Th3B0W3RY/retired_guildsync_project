        banner_body: 이 계정은 임시 또는 미확인 이메일을 사용 중입니다. 아래에 실제 주소를 입력하고 보내는 링크를 확인하세요.
        invalid_link: 이 확인 링크가 잘못되었거나 만료되었습니다. 아래에서 새 이메일을 요청하세요.
        success_notice: 이메일 주소가 확인되었습니다.
        update_failed: 이메일을 업데이트할 수 없습니다. 다시 시도하거나 새 확인 링크를 요청하세요.
