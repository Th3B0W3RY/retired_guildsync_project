      features:
        guild_management:
          title: Gildeverwaltung
          description: Mehrere Gilden einfach organisieren und verwalten. Mitglieder, Rollen und Berechtigungen in einem Ort verfolgen.
        event_planning:
          title: Eventplanung
          description: Terminpläne erstellen und Veranstaltungen verwalten mit RSVP-Bestätigungen, Erinnerungen und Teilnehmerverwaltung.
        member_analytics:
          title: Mitgliedeanalytik
          description: Erhalten Sie Einblick in Ihre Gemeinschaft mit einzelnden Analysen und Mitgliedaktivitätsverfolgung.
        gear_checks:
          title: Ausrüstungsprüfungen
          description: Verfolgen und überprüfen Sie die Geräteausstattung von Mitgliedern und die Ausrüstungsanforderungen bei Veranstaltungen und Aktivitäten.
        gear_records:
          title: Fahrradkatalog
          description: Umfassende Aufzeichnungen von Mitgliederausrüstung, Upgrades und Geräteverlauf unterhalten.
        member_tracking:
          title: Mitgliederverfolgung
          description: Detaillierte Aufzeichnungen über Mitgliederaktivität, -teilnahme und Interaktionen across allen Gildeaktivitäten.
        role_management:
          title: Rollenverwaltung
          description: Rollen mit benutzerdefinierten Berechtigungen zuweisen und verwalten. Aufträge und Verantwortlichkeiten einfach kontrollieren.
        communication_hub:
          title: Kommunikations-Zentrale
          description: Zentralisierte Kommunikationswerkzeuge für Ankündigungen, Diskussionen und Mitgliedkoordination.
        activity_logs:
          title: Aktivität Logdateien
          description: Umfassendes Aktivitäts-Tracking und Logging für alle Gildenevents, Mitgliederna handlungen und Systemänderungen.
