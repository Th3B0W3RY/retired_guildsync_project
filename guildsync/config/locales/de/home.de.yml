de:
  home:
    landing:
      title: Verwalte deine Gilden mit Leichtigkeit.
      subtitle: Die ultimative Discord-Gildenverwaltungsplattform für optimierte Abläufe, Mitglieder-Tracking und stärkere Zusammenarbeit.
      hero_kicker: Für echtes Gilden-Management gemacht
      problem_title: Verwaltest du deine Gilde noch über viele einzelne Tools?
      problem_subtitle: GuildSync bündelt Rekrutierung, Events, Kommunikation und Governance in einem Workflow.
      outcome_1_title: Weniger manueller Koordinationsaufwand
      outcome_1_desc: Bringt lose Abläufe aus Chats, Tabellen und Screenshots zusammen – damit Offiziere weniger wiederholen müssen.
      outcome_2_title: Event-Organisation sichtbar machen
      outcome_2_desc: Plane Events, sieh Zusagen nahezu in Echtzeit, verfolge Zu-spät-Kommen und überwache Klassen- oder Rollen-Abdeckung.
      outcome_3_title: Mitgliederbindung stärken
      outcome_3_desc: Klare Schritte, zeitnahes Feedback und nachvollziehbare Einträge helfen der Führung, Beteiligung und Bleibe zu halten.
      trust:
        no_card: Keine Kreditkarte nötig zum Start
        setup: Schnelles Onboarding für dein Gildenteam
        security: Sichere Rechte und Nachvollziehbarkeit
      preview_title: Produktvorschau
      preview:
        events_title: Events
        events_desc: Erstelle Events und sieh Anmeldungen und Anwesenheit auf einen Blick.
        members_title: Mitglieder
        members_desc: Roster-Infos, Rollen und Status an einem Ort.
        loot_title: Loot & Abstimmungen
        loot_desc: Strukturierte Würfe und Umfragen mit klarem, gemeinsamen Protokoll.
        logs_title: Aktivitätsprotokoll
        logs_desc: Wichtige Offiziers- und Gildenaktionen für Verantwortlichkeit festhalten.
      explore_pricing: Preise ansehen
      why_title: Warum GuildSync wählen?
      features_cta_hint: Klicke auf jede Karte, um zu sehen, was die Funktionen wirklich tun!
      features_section_subtitle: Öffne eine beliebige Karte für Details—ideal für Besucher, die Gilden-Tools vergleichen.
      feedback:
        section_title: Nutzerfeedback
        carousel_role: Karussell
        slide_role: Folie
        keyboard_hint: Mit den Pfeiltasten links und rechts zwischen den Erfahrungsberichten wechseln.
        announce_progress: Nutzerfeedback %{current} von %{total}
        previous: Vorheriges Feedback
        next: Nächstes Feedback
        pagination: Feedback-Folien
        go_to_slide: Zu Feedback %{index} springen
      compare_title: GuildSync vs Mitbewerber
      compare_old_title: Tabellen + nur Discord
      compare_old_1: Richtigen Tab suchen – oder neue anlegen
      compare_old_2: Mehrere Tabs, Ablagen und DMs manuell pflegen
      compare_old_3: Offiziere für Korrekturen und Doppelchecks hinterherlaufen
      compare_new_title: GuildSync-Kommandozentrale
      compare_new_1: Angemeldete Offiziere erreichen Dokumente, Workflows und strukturierte Admin-Abläufe schnell
      compare_new_2: Mitgliederdaten, Anwesenheit und Berechtigungen bleiben in einem System
      compare_new_3: Gilden-Verlauf, Aktivitätslogs und benachrichtigungsfreundliche Workflows
      footer_copyright: "© %{year} GuildSync. Alle Rechte vorbehalten."
      cta:
        title: Bereit loszulegen?
        description: Schließe dich Tausenden von Gildenführern an, die GuildSync für die Verwaltung ihrer Communities vertrauen. Starte jetzt deine kostenlose Testphase.
        button: Kostenlose Testphase starten
        button_hero: Jetzt kostenlos starten
      feature_spotlight:
        title: Wofür GuildSync im Alltag wirklich hilft
        subtitle: Für echte Gildenarbeit gebaut – von Rekrutierung und Dokumenten bis zu Allianzen und Moderation.
        documents_title: Gildendokumente
        documents_desc: Teile SOPs, Builds und Guides per öffentlichem Link oder nur für Mitglieder.
        activity_title: Aktivitätsfeed + Logs
        activity_desc: Verfolge Offiziers-Aktionen, Roster-Änderungen und Betriebsgeschichte auf einer Zeitleiste.
        alliance_title: Allianz-System
        alliance_desc: Koordiniere Allianz-Events, Umfragen und Loot-Rolls über Partnergilden hinweg.
        recruit_title: Rekrutierung & Bewerbungen
        recruit_desc: Strukturierte Bewerbungen mit Notizen, Annehmen/Ablehnen und Nachfass-Nachrichten.
        ocr_title: KI-Scan von Gear-Screenshots
        ocr_desc: Lade Screenshots hoch, extrahiere Ausrüstungsdaten schnell und halte Member-Gear aktuell.
        roles_title: Eigene Rollen + Farb-Tags
        roles_desc: Feingranulare Rechte plus vordefinierte Farb-Tags für einen klareren Roster auf einen Blick.
        warnings_title: Verwarnungen
        warnings_desc: Klare Listen für unverwarnt, verwarnt und gesperrt – unterstützt Moderations-Workflows.
        messaging_title: Nachrichtencenter
        messaging_desc: Hilft Gildenleitung und Offizieren, Mitglieder direkt in GuildSync zu erreichen.
        analytics_title: Rangliste + Beteiligung
        analytics_desc: Erkenne sehr aktive Mitglieder an Anwesenheit und Beteiligungstrends für bessere Offiziers-Entscheidungen.
      compare:
