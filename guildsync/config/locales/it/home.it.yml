      features:
        guild_management:
          title: Gestione della Gilda
          description: Organizza e gestiona facilmente diverse gilde. Monitora i membri, i ruoli e le permessenze tutto in un unico posto.
        event_planning:
          title: Organizzazione degli eventi
          description: Programmare e gestire eventi con il monitoraggio delle ricevute di conferma, i ricordini e la gestione dei partecipanti.
        member_analytics:
          title: Analitica Membro
          description: Ottieni prospettive sul tuo comunità con analitiche dettagliate e tracciamento dell'attività dei membri.
        gear_checks:
          title: Controlli Dell'Attrezzatura
          description: Monitorare e verificare l'equipaggiamento del membro e le richieste di attrezzatura per eventi e attività.
        gear_records:
          title: Record di attrezzatura
          description: Mantieni registrazioni complete di attrezzatura, aggiornamenti e storia del equipaggiamento dei membri.
        member_tracking:
          title: Traccia dei Membri
          description: Tenere registrazioni dettagliate delle attività dei membri, della loro partecipazione e impegno nelle attività di tutto il guild.
        role_management:
          title: Gestione dei Ruoli
          description: Assegnare e gestire i ruoli con autorizzazioni personalizzate. Controllare l'accesso e le responsabilità con facilità.
        communication_hub:
          title: Centro di Comunicazione
          description: Strumenti di comunicazione centralizzati per i comunicamenti, le discussioni e la coordinazione dei membri.
        activity_logs:
          title: Loghi delle attività
          description: Un tracciamento completo delle attività e registrazione di tutti gli eventi della guilde, azioni dei membri e cambiamenti nel sistema.
