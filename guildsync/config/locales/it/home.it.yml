        section_title: Feedback degli utenti
        carousel_role: carosello
        slide_role: diapositiva
        keyboard_hint: Usa le frecce sinistra e destra per spostarti tra le testimonianze.
        announce_progress: Feedback utenti %{current} di %{total}
        previous: Feedback precedente
        next: Feedback successivo
        pagination: Slide dei feedback
        go_to_slide: Vai al feedback %{index}
      compare_title: GuildSync vs concorrenti
      compare_old_title: Foglio di calcolo + solo Discord
      compare_old_1: Trovare il foglio giusto (o crearne uno nuovo)
      compare_old_2: Aggiornare manualmente più schede e fogli
      compare_old_3: Chiedere agli ufficiali di aggiornare e ricontrollare
      compare_new_title: Centro comando GuildSync
      compare_new_1: Gli ufficiali connessi accedono rapidamente a documenti, workflow e flussi di amministrazione strutturati
      compare_new_2: Centralizza dati sui membri, presenze e gestione dei permessi
      compare_new_3: Cronologia della gilda, log attività e notifiche
