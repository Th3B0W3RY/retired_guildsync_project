        discord_connect_warning: Discord zu verbinden kann die Anmeldung erleichtern und Funktionen erweitern.
      language:
        title: Sprache
        description: Wähle deine bevorzugte Sprache. Standard ist Englisch für angemeldete Konten (Ausgeloggt kann weiterhin die Browsersprache gelten, sofern du keine Sprache aus dem Menü wählst).
        label: Bevorzugte Sprache
        auto_detect: Standard (Englisch)
        save: Sprache speichern
        updated: Spracheinstellung aktualisiert.
        invalid: Ungültige Sprachauswahl.
