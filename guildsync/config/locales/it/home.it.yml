        title: Pronto a cominciare?
        description: Unisciti a migliaia di comunità di giochi che già utilizzano GuildSync.
        button: Inizia la tua Prova Gratuita
        button_hero: Inizia Gratis
      feature_spotlight:
        title: Cosa ti aiuta davvero a gestire GuildSync
        subtitle: 'Progettato per operazioni reali di gilda: dal recruiting e documenti al coordinamento alleanze e moderazione.'
        documents_title: Documenti di gilda
        documents_desc: Condividi SOP, build e guide con link pubblici o accesso solo interno.
        activity_title: Feed attività + log
        activity_desc: Traccia azioni di leadership, cambi membri e storico operativo in una timeline unica.
        alliance_title: Sistema alleanze
        alliance_desc: Coordina eventi alleanza, sondaggi e loot roll tra gilde partner.
        recruit_title: Recruiting + candidature
        recruit_desc: Gestisci un processo di candidatura strutturato con note, flussi accetta/rifiuta e messaggi di follow-up.
        ocr_title: Scansione IA screenshot equipaggiamento
        ocr_desc: Carica screenshot, estrai rapidamente i dati loadout e mantieni aggiornato lo stato equipaggiamento dei membri.
        roles_title: Ruoli personalizzati + tag colorati
        roles_desc: Configura permessi granulari e assegna tag colore predefiniti per una rapida visibilità del roster.
        warnings_title: Sistema avvisi
        warnings_desc: Mantieni liste senza avvisi, avvisati e bannati per i flussi di moderazione.
        messaging_title: Centro messaggi
        messaging_desc: Aiuta GM e ufficiali a comunicare con i membri direttamente da GuildSync.
        analytics_title: Classifica + coinvolgimento
        analytics_desc: Evidenzia i membri più attivi per presenza e trend di partecipazione per guidare le decisioni di leadership.
