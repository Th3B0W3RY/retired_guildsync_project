        ocr_desc: 上传截图，快速提取配装数据，并保持成员装备状态最新。
        roles_title: 自定义角色 + 彩色标签
        roles_desc: 配置细粒度权限并分配预设彩色标签，快速提升名册可视性。
        warnings_title: 警告系统
        warnings_desc: 维护无警告、已警告和已封禁名单，以支持治理流程。
        messaging_title: 消息中心
        messaging_desc: 帮助会长和官员直接在 GuildSync 中与成员沟通。
        analytics_title: 排行榜 + 参与度
        analytics_desc: 根据出勤和参与趋势识别高活跃成员，辅助管理决策。
