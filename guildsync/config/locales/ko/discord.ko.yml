ko:
  discord_connections:
    auto_authorize_bot:
      title: 봇 인증 창 여는 중...
      please_authorize: '"%{server_name}"에 봇이 참여할 수 있도록 인증해주세요'
    show:
      title: 길드 Discord에 봇 연결
      subtitle_connected: Discord 계정이 이미 연결되어 있습니다. 이벤트 관리 및 알림을 위해 GuildSync 봇을 연결할 Discord 서버(소유자 또는 관리자 권한 필요)를 선택하세요.
      subtitle_not_connected: 먼저 Discord 계정을 연결하세요(1회 설정). 그런 다음 GuildSync 봇을 연결할 Discord 서버(소유자 또는 관리자 권한 필요)를 선택하세요. 서버를 선택하면 GuildSync 봇의 서버 참여를 인증하게 됩니다.
      server_not_selected:
        title: Discord 서버가 선택되지 않음
        message: 이벤트를 게시할 Discord 서버를 선택해주세요.
        select_button: Discord 서버 선택
      server_selected:
        title: Discord 서버 선택됨
        server_label: '서버:'
        connected: 연결됨
      bot_connected:
        title: GuildSync 봇이 연결되었습니다
      configuration_error:
        title: 설정 오류
      bot_authorization:
        title: 봇 인증 필요
        message: 아래를 클릭해 GuildSync 봇이 Discord 서버 "%{server_name}"에 참여하도록 인증하세요.
        authorize_button: GuildSync 봇 인증
        authorize_hint: 위 버튼을 클릭해 GuildSync 봇이 Discord 서버 "%{server_name}"에 참여하도록 인증하세요. 인증 후 팝업은 자동으로 닫힙니다.
