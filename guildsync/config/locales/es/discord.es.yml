      delete_connection: Eliminar Conexión
      delete_confirm: "¿Estás seguro de que quieres eliminar esta conexión inválida de Discord?"
      bot_not_connected:
        title: No Conectado
        message: El bot GuildSync no está conectado a un servidor de Discord para este grupo.
      connect_section:
        title: Conectar Bot al Servidor de Discord
        already_connected: Tu cuenta de Discord ya está conectada. Selecciona el servidor de Discord al que deseas conectar el bot GuildSync. Debes ser dueño o administrador del servidor.
        not_connected: Primero, conéctate tu cuenta de Discord (configuración única). Luego selecciona el servidor de Discord al que quieres conectar el robot GuildSync. Debes ser dueño o administrador del servidor. Después de seleccionar un servidor, autorizarás al robot GuildSync para unirse a ese servidor.
