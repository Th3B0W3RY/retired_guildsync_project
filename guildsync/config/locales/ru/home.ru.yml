        title: Готовы приступить?
        description: Присоединяйтесь к тысячам игровых сообществ, уже использующих GuildSync.
        button: Начать бесплатную пробу
        button_hero: Начать бесплатно
      feature_spotlight:
        title: Что GuildSync действительно помогает вам вести
        subtitle: 'Создано для реальных операций гильдии: от рекрутинга и документов до координации альянсов и модерации.'
        documents_title: Документы гильдии
        documents_desc: Делитесь SOP, билдами и гайдами через публичные ссылки или только внутренний доступ.
        activity_title: Лента активности + логи
        activity_desc: Отслеживайте действия руководства, изменения участников и операционную историю в одной ленте.
        alliance_title: Система альянсов
        alliance_desc: Координируйте события, опросы и розыгрыши лута альянса между гильдиями-партнерами.
        recruit_title: Рекрутинг + заявки
        recruit_desc: Ведите структурированный процесс заявок с заметками, сценариями принять/отклонить и последующими сообщениями.
        ocr_title: ИИ-сканирование скриншотов экипировки
        ocr_desc: Загружайте скриншоты, быстро извлекайте данные о сборке и держите статус экипировки участников актуальным.
        roles_title: Пользовательские роли + цветные теги
        roles_desc: Настройте детальные разрешения и назначайте предустановленные цветные теги для быстрой видимости состава.
        warnings_title: Система предупреждений
        warnings_desc: Ведите списки без предупреждений, с предупреждениями и заблокированных для процессов модерации.
        messaging_title: Центр сообщений
        messaging_desc: Помогайте ГМам и офицерам общаться с участниками напрямую из GuildSync.
        analytics_title: Рейтинг + вовлеченность
        analytics_desc: Выделяйте самых активных участников по посещаемости и трендам участия, чтобы поддерживать решения руководства.
      compare:
