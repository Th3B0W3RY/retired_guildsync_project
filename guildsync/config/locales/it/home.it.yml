it:
  home:
    landing:
      title: Benvenuto a GuildSync
      subtitle: La piattaforma tutto in uno per gestire le tue community di gioco, eventi e membri.
      hero_kicker: Pensato per capi gilda, ufficiali e community attive
      problem_title: Dal caos dei fogli di calcolo alla chiarezza operativa
      problem_subtitle: Unifica eventi, membri, candidature e flussi loot in un unico posto così gli ufficiali dedicano meno tempo all’amministrazione e più alla leadership.
      outcome_1_title: Operazioni loot eque
      outcome_1_desc: Regole coerenti, storico partecipazioni visibile e meno attriti.
      outcome_2_title: Coordina meglio gli eventi
      outcome_2_desc: Pianifica eventi, ottieni conteggi iscrizioni in tempo reale, monitora i ritardi e visualizza la copertura classi/ruoli in tempo reale.
      outcome_3_title: Riduci il carico degli ufficiali
      outcome_3_desc: Controlli basati sui ruoli e log di audit mantengono i flussi prevedibili.
      trust:
        no_card: Nessuna carta di credito richiesta
        setup: Configurazione rapida per i team di gilda
        security: Permessi per ruolo + log di attività completi
      preview_title: Anteprima del prodotto
      preview:
        events_title: Eventi
        events_desc: Crea eventi in fretta, traccia presenze e trend di partecipazione.
        members_title: Membri
        members_desc: Gestisci ruoli, tag, candidature e permessi a livello gilda da un hub unico.
        loot_title: Loot + sondaggi
        loot_desc: Esegui roll loot e sondaggi strutturati con tracciamento trasparente.
        logs_title: Log attività
        logs_desc: Registra le azioni di leadership per responsabilità e contesto storico.
      explore_pricing: Scopri i prezzi
      why_title: Perché Scegliere GuildSync?
      features_cta_hint: Clicca su ogni scheda per scoprire cosa fanno davvero le funzionalità.
      features_section_subtitle: Apri una scheda per approfondire—ideale per chi confronta strumenti per gilde.
