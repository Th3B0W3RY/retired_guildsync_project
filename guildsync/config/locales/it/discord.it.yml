        not_connected: Innanzitutto, collega il tuo account Discord (impostazione unica). Poi seleziona quale server di Discord vuoi connettere il bot GuildSync a. Devi essere un proprietario o un amministratore del server. Dopo aver selezionato un server, autorizzerai il bot GuildSync ad unirsi a quello specifico server.
