          title: Discord-Anmeldung
          description: Mit deinem Discord-Konto anmelden
          button: Discord verwenden
          button_active: Discord aktiv
          connect_first: Zuerst Discord-Konto verbinden
        google:
          title: Gmail-Anmeldung
          description: Du meldest dich mit Google an (verknüpftes Gmail- oder Google-Workspace-Konto).
          active: Gmail aktiv
