<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Under Maintenance – GuildSync</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      max-width: 28rem;
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.75rem;
      padding: 2.5rem;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: #6366f1;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #f1f5f9;
      margin: 0 0 0.75rem;
    }
    p {
      color: #cbd5e1;
      margin: 0;
      line-height: 1.6;
      font-size: 1rem;
    }
    .discord-note {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #334155;
      font-size: 0.9375rem;
      color: #94a3b8;
    }
    .discord-note a {
      color: #6366f1;
      text-decoration: none;
    }
    .discord-note a:hover {
      text-decoration: underline;
      color: #818cf8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">GuildSync</div>
    <h1>Under maintenance</h1>
    <p>We're updating things and will be back shortly. Thanks for your patience.</p>
    <p class="discord-note">Check our <a href="https://discord.gg/guildsync" target="_blank" rel="noopener">Discord</a> for status updates and more info.</p>
  </div>
</body>
</html>
