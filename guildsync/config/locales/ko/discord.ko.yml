        title: 연결이 유효하지 않음
        message: Discord 연결이 더 이상 유효하지 않습니다. 다시 연결해주세요.
        last_connected: '마지막 연결 계정:'
      reconnect_discord: Discord 다시 연결
      delete_connection: 연결 삭제
      delete_confirm: 이 유효하지 않은 Discord 연결을 삭제하시겠습니까?
      bot_not_connected:
        title: 봇이 연결되지 않음
        message: 이 길드의 Discord 서버에 GuildSync 봇이 연결되어 있지 않습니다.
      connect_section:
        title: Discord 서버에 봇 연결
        already_connected: Discord 계정이 이미 연결되어 있습니다. GuildSync 봇을 연결할 Discord 서버를 선택하세요. 서버의 소유자 또는 관리자여야 합니다.
        not_connected: 먼저 Discord 계정을 연결하세요(1회 설정). 그런 다음 GuildSync 봇을 연결할 Discord 서버를 선택하세요. 서버의 소유자 또는 관리자여야 합니다. 서버를 선택한 후 GuildSync 봇의 서버 참여를 인증하게 됩니다.
        select_server: Discord 서버 선택
        connect_and_select: Discord 계정 연결 및 서버 선택
      back_to_dashboard: 대시보드로 돌아가기
      popup_blocked: 팝업이 차단되었습니다. 이 사이트의 팝업을 허용한 후 다시 시도하세요.
    select_server:
      title: Discord 서버 선택
      subtitle: GuildSync 봇을 연결할 Discord 서버를 선택하세요. 서버를 선택한 후 GuildSync 봇의 서버 참여를 인증하게 됩니다.
      header: Discord 서버
      header_subtitle: GuildSync 봇을 연결할 수 있도록 소유자 또는 관리자 권한이 있는 서버를 선택하세요
      role_owner: 소유자
      role_admin: 관리자
      empty_title: Discord 서버를 찾을 수 없음
      empty_message: 봇을 연결하려면 최소 한 개 이상의 Discord 서버에서 소유자 또는 관리자여야 합니다.
      go_back: 뒤로 가기
      back_to_dashboard: 대시보드로 돌아가기
    callback_success:
      title: 연결 성공!
      message: Discord 서버가 성공적으로 연결되었습니다.
      closing: 이 창은 1초 후 자동으로 닫힙니다...
    callback_error:
      title: 연결 실패
      closing: 이 창은 3초 후 자동으로 닫힙니다...
  discord_user_auth:
    callback_success:
      title: Discord 인증 성공
      closing: 성공! 창을 닫는 중...
    callback_error:
      title: 오류
      default_message: Discord 인증에 실패했습니다.
      closing: 이 창은 2초 후 자동으로 닫힙니다...
