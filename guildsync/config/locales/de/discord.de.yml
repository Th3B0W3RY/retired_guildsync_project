        message: Die Ereignisse werden ins im Einstellungen konfigurierte Kanal gepostet.
      event_details: Veranstaltungsdetails
      event_type:
        label: Eventart
        pvp: Spieler gegen Spieler
        guild_scrim: Gilde-Scrim
        gvg: Gilde gegen Gilde
        regular_scrim: Regulare Scrim
        pve_event: Spieler gegen Umgebung-Event
        world_boss: Welt-Chef
        guild_questing_time: Gilde Questing Zeit
        custom: Benutzerdefiniert
